workflows:
  android-apk:
    name: Android APK
    instance_type: linux
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Prepare Flutter project
        script: |
          flutter create .
          flutter pub get

      - name: Build release APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
